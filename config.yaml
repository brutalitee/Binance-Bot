# ============================================================
# config.yaml - All tunable parameters live here
# Edit this file to experiment. Never put secrets here.
# ============================================================

# ---------------------- COINS & TIMEFRAME ----------------------
my_coins:
  - BTCUSDT
  - ETHUSDT
candle_size: "1h"

# ---------------------- TRADING PLAN (Entry) -------------------
trend_line_length: 30                # faster trend (was 40)
rsi_length: 14
rsi_too_low: 45.0                    # much more permissive
rsi_too_high: 70.0
volume_average_length: 15            # slightly shorter
bollinger_length: 20
bollinger_width: 2.2                 # slightly wider bands

# ---------------------- TRADING PLAN (Exit) --------------------
take_profit_percent: 0.03            # 3%
trailing_stop_percent: 0.018
hard_stop_percent: 0.018             # 1.8%

# ---------------------- SAFETY RULES ---------------------------
risk_one_percent: 0.01
max_trades_at_once: 2
daily_loss_limit: 0.03
daily_pause_hours: 24
loss_streak_pause_hours: 8
too_crazy_volatility: 4.0
smallest_order_usd: 10.0
quiet_news_hours_utc: []

# ---------------------- COSTS ----------------------------------
fee_percent: 0.001
slippage_percent: 0.0005

# ---------------------- BACKTEST & GATES -----------------------
backtest_years: 2
#good_profit_factor: 1.4
safe_max_drawdown: 0.15
too_good_win_rate: 0.80
min_trades_required: 15              # temporary – raise back to 30 later
good_profit_factor: 1.3
paper_days_needed: 30

# ---------------------- TECHNICAL ------------------------------
wait_between_calls: 1.0
max_retries: 3