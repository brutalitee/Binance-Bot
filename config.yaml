# ============================================================
# config.yaml - All tunable parameters live here
# Edit this file to experiment. Never put secrets here.
# ============================================================

# ---------------------- COINS & TIMEFRAME ----------------------
my_coins:
  - BTCUSDT
  - ETHUSDT
candle_size: "1h"

# ---------------------- TRADING PLAN (Entry) -------------------
trend_line_length: 40
rsi_length: 14
rsi_too_low: 48.0
rsi_too_high: 65.0
volume_average_length: 20
bollinger_length: 20
bollinger_width: 2.0

# ---------------------- TRADING PLAN (Exit) --------------------
take_profit_percent: 0.025          # 2.5%
trailing_stop_percent: 0.015
hard_stop_percent: 0.015            # 1.5%

# ---------------------- SAFETY RULES ---------------------------
risk_one_percent: 0.01              # risk 1% of capital per trade
max_trades_at_once: 2
daily_loss_limit: 0.03              # -3% day → pause
daily_pause_hours: 24
loss_streak_pause_hours: 8
too_crazy_volatility: 4.0
smallest_order_usd: 10.0
quiet_news_hours_utc: []            # e.g. [13, 14, 15]

# ---------------------- COSTS ----------------------------------
fee_percent: 0.001                  # 0.1% per side
slippage_percent: 0.0005

# ---------------------- BACKTEST & GATES -----------------------
backtest_years: 2
good_profit_factor: 1.4             # lowered slightly while we increase sample size
safe_max_drawdown: 0.15
too_good_win_rate: 0.80
min_trades_required: 30             # honesty check
paper_days_needed: 30

# ---------------------- TECHNICAL ------------------------------
wait_between_calls: 1.0
max_retries: 3